name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # BSD（macOS 同梱）と GNU のコマンドの違い、bash 3.2 と 5.x の違いで落ちないかを見る
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: make check（取り込み先と同じ形に並べて実行）
        run: ./scripts/ci-check.sh
