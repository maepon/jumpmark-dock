<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jumpmark Dock</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- メイン画面 -->
    <div id="mainView">
      <div class="header">
        <h1 class="app-title">Jumpmark Dock</h1>
        <div class="current-url" id="currentUrl" data-i18n="loading">
          Loading...
        </div>
      </div>

      <div class="jumpmarks-container" id="jumpmarksContainer">
        <!-- Jumpmarkリストがここに表示される -->
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">⚓</div>
          <p data-i18n="popupEmptyTitle">No Jumpmarks for this page yet</p>
          <p class="empty-subtitle" data-i18n="popupEmptySubtitle">
            Add a shortcut to a related page
          </p>
        </div>
      </div>

      <div class="footer">
        <button id="addButton" class="add-button" data-i18n="popupAddButton">
          + Add Jumpmark
        </button>
      </div>
    </div>

    <!-- 追加フォーム -->
    <div id="formView" class="hidden">
      <div class="form-header">
        <button id="backButton" class="back-button" data-i18n="popupBackButton">
          ← Back
        </button>
        <h2 id="formTitle" data-i18n="popupFormTitleNew">New Jumpmark</h2>
      </div>

      <form id="jumpmarkForm" class="jumpmark-form">
        <div class="form-group">
          <label for="jumpmarkTitle" data-i18n="labelTitle">Title</label>
          <input
            type="text"
            id="jumpmarkTitle"
            placeholder="Related page"
            data-i18n-placeholder="popupTitlePlaceholder"
            required
          />
        </div>

        <div class="form-group">
          <label for="jumpmarkUrl" data-i18n="labelUrl">URL</label>
          <input
            type="url"
            id="jumpmarkUrl"
            placeholder="https://example.com"
            required
          />
        </div>

        <div class="form-group" id="iconFormGroup">
          <label for="jumpmarkIcon" data-i18n="popupIconLabel"
            >Icon (emoji)</label
          >
          <input type="text" id="jumpmarkIcon" placeholder="📝" maxlength="2" />
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="bidirectional" checked />
            <span class="checkmark"></span>
            <span data-i18n="popupBidirectionalLabel"
              >Bidirectional link (also create a Jumpmark back to this page from
              the target page)</span
            >
          </label>
        </div>

        <!-- 高度な設定（アコーディオン） -->
        <div class="advanced-accordion" id="advancedAccordion">
          <div
            class="accordion-header"
            id="accordionHeader"
            data-i18n="popupAdvancedHeader"
          >
            Advanced settings (customize the source URL)
          </div>
          <div class="accordion-content">
            <div class="form-group">
              <label for="sourceUrlPattern" data-i18n="popupSourcePatternLabel"
                >Source URL to match</label
              >
              <input
                type="text"
                id="sourceUrlPattern"
                placeholder="github.com/owner/repo*"
              />
              <span class="info-text" data-i18n="wildcardHint"
                >Add "*" to the end to use it as a wildcard.</span
              >
              <span
                id="wildcardNotice"
                class="warning-text hidden"
                data-i18n="wildcardNotice"
                >Note: a wildcard pattern creates a one-way link only</span
              >
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button
            type="button"
            id="cancelButton"
            class="cancel-button"
            data-i18n="actionCancel"
          >
            Cancel
          </button>
          <button type="submit" class="save-button" data-i18n="actionSave">
            Save
          </button>
        </div>
      </form>
    </div>

    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
