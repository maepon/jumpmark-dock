name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # 拡張機能のテストと整形チェック（npm test / npm run format:check）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check

  # AI開発フロー（ai-flow/）の静的検査と回帰テスト。課金も通信も無い
  ai-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C ai-flow check
